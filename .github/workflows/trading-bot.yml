name: Trading Bot

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos, todos los días
  workflow_dispatch:

jobs:
  revisar-mercados:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TRADING_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TRADING_TELEGRAM_CHAT_ID }}
          IDIOMA: ${{ vars.TRADING_BOT_IDIOMA }}
        run: python trading_bot.py
