<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Te amo con la vida 🩷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:ital,wght@1,600;1,700&family=Parisienne&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   BASE
   ═══════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --rosa-fuerte:#d81b60;
  --rosa-hondo:#ad1457;
  --rosa-suave:#f8bbd0;
  --vidrio:linear-gradient(160deg,rgba(255,255,255,.62),rgba(255,214,228,.34));
  --vidrio-borde:1px solid rgba(255,255,255,.68);
  --vidrio-luz:inset 0 1.4px 1px rgba(255,255,255,.92),inset 0 -8px 14px -10px rgba(216,27,96,.28);
  --vidrio-sombra:0 10px 26px rgba(216,27,96,.16);
  --blur:blur(22px) saturate(190%);
  --suave:cubic-bezier(.22,1,.36,1);
}

html,body{height:100%;overscroll-behavior:none}

body{
  min-height:100vh;
  min-height:100dvh;
  width:100%;
  overflow:hidden;
  background:linear-gradient(150deg,#ffd9e2 0%,#ffc2d1 45%,#ffb6c1 100%);
  font-family:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
  display:flex;align-items:center;justify-content:center;
  position:relative;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  color:var(--rosa-hondo);
}

/* Toda cosa tocable comparte esto: es lo que hace que iPhone responda */
.tocable{
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  appearance:none;-webkit-appearance:none;
}

/* ═══════════════════════════════════════════════════════════
   AMBIENTE: corazones y palabras que suben
   ═══════════════════════════════════════════════════════════ */
#ambiente{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}

.sube-corazon{
  position:absolute;bottom:-40px;
  animation:subir linear forwards;
  will-change:transform,opacity;
}

.sube-palabra{
  position:absolute;bottom:-40px;
  font-family:'Parisienne',cursive;
  font-size:clamp(1.3rem,4.4vw,1.6rem);
  color:rgba(168,17,84,.92);
  white-space:nowrap;
  text-shadow:0 1px 3px rgba(255,255,255,1),0 0 12px rgba(255,255,255,.75);
  animation:subir linear forwards;
  will-change:transform,opacity;
}

@keyframes subir{
  0%{transform:translate(0,0) rotate(0deg);opacity:0}
  12%{opacity:var(--op,.45)}
  85%{opacity:var(--op,.45)}
  100%{transform:translate(var(--dx,30px),-112vh) rotate(var(--rot,8deg));opacity:0}
}

/* ═══════════════════════════════════════════════════════════
   AVISO (el "Errorrrr" / "Bobaaa, no es ese")
   ═══════════════════════════════════════════════════════════ */
.aviso{
  position:fixed;top:max(24px,env(safe-area-inset-top));left:50%;
  transform:translateX(-50%) translateY(-140%);
  background:linear-gradient(180deg,rgba(255,216,227,.82),rgba(255,178,199,.6));
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:var(--vidrio-borde);border-radius:100px;
  padding:.72rem 1.7rem;
  font-size:1.05rem;font-weight:700;letter-spacing:.3px;
  color:var(--rosa-hondo);
  box-shadow:var(--vidrio-sombra),var(--vidrio-luz);
  z-index:1200;opacity:0;pointer-events:none;white-space:nowrap;
  transition:opacity .32s ease,transform .42s var(--suave);
}
.aviso.ver{opacity:1;transform:translateX(-50%) translateY(0)}

/* ═══════════════════════════════════════════════════════════
   CONTADOR DE AMOR
   ═══════════════════════════════════════════════════════════ */
#contador{
  position:fixed;top:0;left:50%;
  transform:translate(-50%,-160px) scale(.9);
  z-index:1000;opacity:0;pointer-events:none;
  transition:transform .95s var(--suave),opacity .6s ease;
  will-change:transform,opacity;
}
/* pequeñito arriba, durante el carrusel */
#contador.arriba{
  opacity:1;
  transform:translate(-50%,max(20px,env(safe-area-inset-top))) scale(.9);
}
/* grande al centro, al principio y al final */
#contador.centro{
  opacity:1;
  transform:translate(-50%,calc(50dvh - 50% - 34px)) scale(1.06);
}
@supports not (height:1dvh){
  #contador.centro{transform:translate(-50%,calc(50vh - 50% - 34px)) scale(1.06)}
}

#contador.centro .contador-flota{animation:flotaLeve 6s ease-in-out infinite}
@keyframes flotaLeve{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}

.contador-vidrio{
  background:var(--vidrio);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:var(--vidrio-borde);border-radius:32px;
  padding:.7rem 1.4rem;text-align:center;
  box-shadow:var(--vidrio-sombra),var(--vidrio-luz);
}

.contador-titulo{
  font-family:'Parisienne',cursive;
  font-size:1rem;color:rgba(173,20,87,.8);
  margin-bottom:.15rem;letter-spacing:.4px;
  max-height:0;opacity:0;overflow:hidden;
  transition:max-height .5s ease,opacity .5s ease,margin .5s ease;
}
#contador.centro .contador-titulo{max-height:2.2rem;opacity:1;margin-bottom:.28rem}

.contador-valor{
  font-size:.95rem;font-weight:800;letter-spacing:.4px;
  color:var(--rosa-fuerte);
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum";
  white-space:nowrap;
  transition:font-size .8s var(--suave);
}
#contador.centro .contador-valor{font-size:1.12rem}

/* el "fallo" del contador */
.contador-valor.fallo{
  animation:glitch .34s steps(2,end) infinite;
  color:#c2185b;
}
@keyframes glitch{
  0%{transform:translate(0,0);opacity:1}
  25%{transform:translate(-1.5px,.5px);opacity:.7}
  50%{transform:translate(1.5px,-.5px);opacity:1}
  75%{transform:translate(-1px,-1px);opacity:.75}
  100%{transform:translate(0,0);opacity:1}
}

/* ═══════════════════════════════════════════════════════════
   BLOQUE FINAL: frase + botón Continuar
   ═══════════════════════════════════════════════════════════ */
#bloqueFinal{
  position:fixed;top:50%;left:50%;
  transform:translateX(-50%);
  margin-top:26px;
  width:min(90vw,430px);
  display:flex;flex-direction:column;align-items:center;gap:1.15rem;
  z-index:990;pointer-events:none;
}

.emerge{
  opacity:0;
  transform:translateY(-52px) scale(.62);
  transition:opacity .7s ease,transform .9s var(--suave);
  will-change:transform,opacity;
}
.emerge.ver{opacity:1;transform:translateY(0) scale(1)}

.frase-gracias{
  font-family:'Parisienne',cursive;
  font-size:1.6rem;line-height:1.35;text-align:center;
  color:var(--rosa-hondo);
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,214,228,.3));
  -webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);
  border:var(--vidrio-borde);border-radius:40px;
  padding:.7rem 1.5rem;
  box-shadow:var(--vidrio-sombra),var(--vidrio-luz);
}

/* ═══════════════════════════════════════════════════════════
   BURBUJAS DE VIDRIO (botones)
   ═══════════════════════════════════════════════════════════ */
.burbuja{
  background:var(--vidrio);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:var(--vidrio-borde);
  color:var(--rosa-fuerte);
  box-shadow:var(--vidrio-sombra),var(--vidrio-luz);
  position:relative;overflow:hidden;
  transition:transform .28s var(--suave),box-shadow .25s ease,background .25s ease;
}
/* el brillito de arriba, como una burbuja de agua real */
.burbuja::after{
  content:"";position:absolute;
  top:5%;left:14%;width:52%;height:34%;
  border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,0));
  pointer-events:none;
}
.burbuja:active{transform:scale(.92)}
@media(hover:hover){
  .burbuja:hover{
    background:linear-gradient(160deg,rgba(255,255,255,.78),rgba(255,196,216,.5));
    box-shadow:0 14px 30px rgba(216,27,96,.3),var(--vidrio-luz);
  }
}

#btnContinuar{
  font-family:'Nunito',sans-serif;
  font-size:1.12rem;font-weight:800;letter-spacing:1.2px;
  padding:.78rem 2.2rem;border-radius:100px;
  pointer-events:auto;
}

/* ═══════════════════════════════════════════════════════════
   CORAZÓN GIGANTE DE TRANSICIÓN
   ═══════════════════════════════════════════════════════════ */
.corazon-portal{
  position:fixed;left:50%;bottom:0;
  transform:translateX(-50%);
  font-size:min(150vw,150vh);
  line-height:1;z-index:1100;pointer-events:none;
  filter:drop-shadow(0 0 60px rgba(216,27,96,.4));
  animation:portal 1.7s cubic-bezier(.42,0,.45,1) forwards;
}
@keyframes portal{
  0%{transform:translateX(-50%) translateY(115%) rotate(-8deg);opacity:1}
  46%{transform:translateX(-50%) translateY(18%) rotate(0deg);opacity:1}
  100%{transform:translateX(-50%) translateY(-115%) rotate(9deg);opacity:0}
}

/* ═══════════════════════════════════════════════════════════
   PANEL DEL PIN
   ═══════════════════════════════════════════════════════════ */
#panelPin{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(1);
  width:min(78vw,260px);
  padding:1.4rem 1rem;text-align:center;
  z-index:40;opacity:0;pointer-events:none;
  transition:opacity .55s ease,transform .6s var(--suave);
}
#panelPin.ver{opacity:1;pointer-events:auto}
#panelPin.fuera{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.94)}

.pin-titulo{
  font-family:'Parisienne',cursive;
  font-size:1.75rem;color:var(--rosa-hondo);
  margin-bottom:1.25rem;display:inline-block;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,214,228,.3));
  -webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);
  border:var(--vidrio-borde);border-radius:40px;
  padding:.35rem 1.2rem;
  box-shadow:var(--vidrio-sombra),var(--vidrio-luz);
  animation:flotaLeve 5.5s ease-in-out infinite;
}

.puntos{display:flex;justify-content:center;gap:.85rem;margin-bottom:1.4rem;transition:transform .1s ease}
.punto{
  width:13px;height:13px;border-radius:50%;
  background:rgba(255,255,255,.7);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 2px 6px rgba(216,27,96,.16),inset 0 1px 1px rgba(255,255,255,.9);
  transition:all .22s var(--suave);
}
.punto.lleno{background:var(--rosa-fuerte);box-shadow:0 0 15px rgba(216,27,96,.75);transform:scale(1.18)}
.punto.ok{background:#43a047;box-shadow:0 0 16px rgba(67,160,71,.8);transform:scale(1.18)}

.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;justify-items:center;margin-bottom:1.3rem}
.tecla{
  width:54px;height:54px;border-radius:50%;
  font-family:'Nunito',sans-serif;font-size:1.45rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
#btnBorrar{
  width:48px;height:48px;border-radius:50%;
  font-size:1.25rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;margin:0 auto;
}

/* ═══════════════════════════════════════════════════════════
   ESCENARIO: tarjeta + flechas
   ═══════════════════════════════════════════════════════════ */
#escenario{
  position:relative;z-index:20;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity .6s ease;
}
#escenario.ver{opacity:1;pointer-events:auto}
#escenario.flota{animation:flotaLeve 7s ease-in-out infinite}

/* EL CUADRADO — su tamaño es idéntico en pregunta y en carrusel */
#tarjeta{
  position:relative;
  width:min(86vw,340px);
  height:min(62dvh,442px);
  border-radius:54px;
  background:linear-gradient(160deg,rgba(255,246,249,.7) 0%,rgba(255,216,230,.5) 55%,rgba(255,198,216,.42) 100%);
  -webkit-backdrop-filter:blur(28px) saturate(200%);backdrop-filter:blur(28px) saturate(200%);
  border:1px solid rgba(255,255,255,.6);
  box-shadow:0 26px 48px rgba(216,27,96,.22),var(--vidrio-luz);
  display:flex;align-items:center;justify-content:center;
  transform:translateY(28px);opacity:0;
  transition:opacity .6s ease,transform .7s var(--suave);
}
@supports not (height:1dvh){#tarjeta{height:min(62vh,442px)}}
#tarjeta.ver{opacity:1;transform:translateY(0)}

#tarjeta::before,#tarjeta::after{
  content:"🩷";position:absolute;font-size:1.5rem;opacity:.55;pointer-events:none;
}
#tarjeta::before{top:-6px;left:6px;transform:rotate(-16deg)}
#tarjeta::after{bottom:-6px;right:6px;transform:rotate(20deg)}

/* ───── zona pregunta ───── */
#zonaPregunta{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:1.5rem;width:100%;
}
#corazonCentral{
  font-size:3rem;margin-bottom:.7rem;display:block;
  animation:latido 2s ease-in-out infinite;
}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.11)}}
#corazonCentral:active{transform:scale(.9)}

.pregunta{
  font-size:1.8rem;font-weight:800;letter-spacing:.5px;line-height:1.3;
  color:var(--rosa-fuerte);text-align:center;
  text-shadow:0 2px 0 rgba(255,255,255,.85);
  margin-bottom:1.4rem;
}

.botones{display:flex;justify-content:center;gap:1.1rem;position:relative}
.btn-si,.btn-no{
  font-family:'Nunito',sans-serif;
  font-size:1.25rem;font-weight:800;letter-spacing:.8px;
  padding:.68rem 1.7rem;border-radius:100px;
}
.btn-si{background:linear-gradient(160deg,rgba(255,236,243,.85),rgba(248,187,208,.55));z-index:5}
.btn-no{z-index:60}

.fila-teamo{
  display:flex;justify-content:center;gap:.65rem;
  margin-top:1.1rem;height:2.6rem;align-items:center;
}
.letra-caja{display:inline-block;width:2.2rem;height:2.2rem;position:relative}
.letra-caja .emo,.letra-caja .ltr{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  transition:opacity .3s ease,transform .35s var(--suave);
}
.letra-caja .emo{font-size:1.6rem;filter:drop-shadow(0 4px 6px rgba(216,27,96,.18))}
.letra-caja .ltr{
  font-size:1.8rem;font-weight:800;color:var(--rosa-fuerte);
  opacity:0;transform:translate(-50%,-50%) scale(.4);
}
.letra-caja.abre .emo{opacity:0;transform:translate(-50%,-50%) scale(2.1)}
.letra-caja.abre .ltr{opacity:1;transform:translate(-50%,-50%) scale(1);animation:brinca .45s var(--suave)}
@keyframes brinca{
  0%{transform:translate(-50%,-50%) scale(.3);opacity:0}
  55%{transform:translate(-50%,-50%) scale(1.25);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1);opacity:1}
}

/* ───── caída: siempre sobre la página entera, nunca recortada ───── */
.cae{animation:caer .62s cubic-bezier(.55,.06,.68,.19) forwards;pointer-events:none!important}
@keyframes caer{
  0%{transform:translateY(0) rotate(0deg);opacity:1}
  100%{transform:translateY(115vh) rotate(24deg);opacity:0}
}

/* ───── zona carrusel ───── */
#zonaCarrusel{
  position:absolute;inset:16px;
  border-radius:40px;overflow:hidden;
  display:none;
  background:rgba(255,255,255,.18);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.7),inset 0 -10px 20px -14px rgba(216,27,96,.3);
}
#zonaCarrusel.ver{display:block}

#pista{display:flex;height:100%;width:100%;transition:transform .55s var(--suave);will-change:transform}
.lamina{min-width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center}
.lamina img{width:100%;height:100%;object-fit:cover;display:block}

.lamina-hueco{
  width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;
  background:linear-gradient(160deg,rgba(255,236,243,.6),rgba(255,205,222,.45));
  color:rgba(173,20,87,.65);
}
.lamina-hueco span{font-size:2.2rem}
.lamina-hueco small{font-size:.85rem;font-weight:700;letter-spacing:.5px}

.lamina-frase{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  padding:1.6rem 1.3rem;text-align:center;
  background:linear-gradient(160deg,rgba(255,240,246,.72),rgba(255,206,223,.55));
}
.lamina-frase p{
  font-family:'Parisienne',cursive;
  font-size:clamp(1.25rem,5.2vw,1.75rem);line-height:1.45;
  color:var(--rosa-hondo);
  text-shadow:0 1px 3px rgba(255,255,255,.9);
}

/* ───── flechas del carrusel ───── */
.flecha{
  position:absolute;top:50%;
  width:54px;height:54px;border-radius:50%;
  font-size:1.9rem;font-weight:700;line-height:1;
  display:flex;align-items:center;justify-content:center;
  padding-bottom:4px;
  z-index:30;opacity:0;
  transition:transform .8s var(--suave),opacity .6s ease,box-shadow .25s ease,background .25s ease;
}
#flechaAtras{left:-74px;transform:translate(-90px,-50%) scale(.6)}
#flechaAdelante{right:-74px;transform:translate(90px,-50%) scale(.6)}
#escenario.flechas #flechaAtras{opacity:1;transform:translate(0,-50%) scale(1)}
#escenario.flechas #flechaAdelante{opacity:1;transform:translate(0,-50%) scale(1)}

/* en pantallas angostas las flechas van DEBAJO del cuadrado */
@media (max-width:620px){
  .flecha{top:auto;bottom:-70px}
  #flechaAtras{left:calc(50% - 66px);transform:translate(-80px,0) scale(.6)}
  #flechaAdelante{right:calc(50% - 66px);transform:translate(80px,0) scale(.6)}
  #escenario.flechas #flechaAtras{transform:translate(0,0) scale(1)}
  #escenario.flechas #flechaAdelante{transform:translate(0,0) scale(1)}
}

/* ═══════════════════════════════════════════════════════════
   LLUVIA DE CORAZONES (al acertar el PIN)
   ═══════════════════════════════════════════════════════════ */
#lluvia{position:fixed;inset:0;pointer-events:none;z-index:950;overflow:hidden}
.gota{position:absolute;bottom:-6vh;animation:subirRapido 3s ease-out forwards;opacity:.75}
@keyframes subirRapido{
  0%{transform:translateY(0);opacity:.9}
  100%{transform:translateY(-115vh);opacity:0}
}

/* corazones gigantes que golpean la tarjeta */
.golpe{
  position:fixed;left:50%;top:-160px;
  transform:translateX(-50%);
  z-index:960;pointer-events:none;opacity:0;
  animation:golpear .7s ease-in forwards;
}
.golpe.mediano{font-size:min(22vw,6rem)}
.golpe.grande{font-size:min(30vw,8rem)}
@keyframes golpear{
  0%{top:-160px;opacity:1;transform:translateX(-50%) rotate(0deg)}
  80%{top:44%;opacity:1;transform:translateX(-50%) rotate(10deg)}
  100%{top:50%;opacity:0;transform:translateX(-50%) rotate(15deg)}
}
.sacude{animation:sacudir .3s ease-out}

/* temblorcito de "hasta aqui llegaste" */
.tiembla{animation:tiemblar .45s ease-in-out}
@keyframes tiemblar{
  0%,100%{transform:translateX(0)}
  14%{transform:translateX(-9px)}
  30%{transform:translateX(8px)}
  46%{transform:translateX(-6px)}
  62%{transform:translateX(4px)}
  80%{transform:translateX(-2px)}
}

/* ondita al tocar una flecha */
.flecha::before{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,255,255,0) 68%);
  opacity:0;pointer-events:none;
}
.flecha.ondea::before{animation:ondita .5s ease-out}
@keyframes ondita{
  0%{opacity:.95;transform:scale(.45)}
  100%{opacity:0;transform:scale(1.75)}
}
@keyframes sacudir{
  0%,100%{transform:translateY(0)}
  30%{transform:translateY(-9px)}
  55%{transform:translateY(5px)}
  80%{transform:translateY(-2px)}
}

/* ═══════════════════════════════════════════════════════════
   AJUSTES POR PANTALLA
   ═══════════════════════════════════════════════════════════ */
@media (max-width:400px){
  .tecla{width:48px;height:48px;font-size:1.3rem}
  #btnBorrar{width:44px;height:44px}
  .pin-titulo{font-size:1.5rem}
  .pregunta{font-size:1.55rem}
  #corazonCentral{font-size:2.6rem}
  .btn-si,.btn-no{font-size:1.12rem;padding:.6rem 1.4rem}
  .frase-gracias{font-size:1.35rem}

#buzonPanel{position:fixed;inset:0;display:block;padding:0;background:transparent;transition:opacity .2s ease}
.bz-caja{position:absolute;top:calc(env(safe-area-inset-top,0px) + 66px);right:12px;width:min(250px,calc(100vw - 24px));padding:10px;border-radius:22px;text-align:left;background:var(--vidrio);border:var(--vidrio-borde);box-shadow:var(--vidrio-sombra),var(--vidrio-luz);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);transform:translateY(-6px);transition:transform .25s var(--suave)}
#buzonPanel.ver .bz-caja{transform:none}
.bz-caja::before,.bz-caja::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.bz-caja::before{background:radial-gradient(rgba(170,110,15,.38) 1px,transparent 1.5px) 0 0/9px 9px}
.bz-caja::after{background:repeating-radial-gradient(circle at 100% 100%,rgba(150,95,10,.3) 0 1.3px,transparent 1.3px 7px);-webkit-mask-image:radial-gradient(circle at 100% 100%,#000,transparent 75px);mask-image:radial-gradient(circle at 100% 100%,#000,transparent 75px)}
.bz-mosaico,.bz-fila,.bz-ok{position:relative;z-index:1}
.bz-caja .bz-flor{z-index:2}
.bz-mosaico{display:block;width:100%;height:auto;margin-bottom:8px;filter:drop-shadow(0 1px 1px rgba(90,50,0,.3))}
.bz-fila{display:flex;align-items:center;gap:8px}
#buzonTexto{flex:1;min-width:0;min-height:0;height:52px;border-radius:12px;border:1px solid rgba(160,105,20,.5);background:rgba(255,251,235,.8);padding:.5rem .65rem;box-shadow:inset 0 1px 4px rgba(120,70,0,.18)}
#buzonTexto:focus{box-shadow:inset 0 1px 4px rgba(120,70,0,.18),0 0 0 2px rgba(224,165,38,.6)}
#buzonTexto.tiembla{animation:bztiembla .35s}
@keyframes bztiembla{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
#buzonEnviar{flex:none;width:42px;height:42px;margin:0;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%;font:800 1.05rem 'Nunito',sans-serif;letter-spacing:0}

#buzonEnviar .fl{display:block}
#buzonEnviar.envia{animation:bzpulso .6s var(--suave)}
#buzonEnviar.envia .fl{animation:bzvuela .7s cubic-bezier(.5,0,.4,1)}
@keyframes bzvuela{0%{transform:none;opacity:1}45%{transform:translate(24px,-24px) scale(.7);opacity:0}46%{transform:translate(-24px,24px) scale(.7);opacity:0}100%{transform:none;opacity:1}}
@keyframes bzpulso{0%{transform:scale(1)}30%{transform:scale(.86)}65%{transform:scale(1.12)}100%{transform:scale(1)}}
.bz-ok{margin-top:.35rem;min-height:0;font-size:.85rem;text-align:center}
.bz-ok:empty{display:none}
.bz-ok.corazon{font-size:1.6rem;line-height:1.2;animation:bzlate .7s var(--suave)}
@keyframes bzlate{0%{transform:scale(.2);opacity:0}55%{transform:scale(1.35);opacity:1}100%{transform:scale(1)}}
.bz-mini{position:absolute;z-index:3;pointer-events:none;font-size:14px;line-height:1;margin:-7px 0 0 -7px;animation:bzmini .95s ease-out both}
@keyframes bzmini{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--rot));opacity:0}}
</style>

/* ═══════════════════════════════════════════════════════════
   TOQUE QUE SÍ FUNCIONA EN IPHONE
   El problema en iOS es que a veces 'click' no llega. Aquí
   escuchamos el dedo (touchend) Y el click, con un candado de
   tiempo para que nunca se dispare dos veces por un solo toque.
   ═══════════════════════════════════════════════════════════ */
function alTocar(el, accion){
  if(!el) return;
  let ix = 0, iy = 0, movio = false, ultimo = -1e9;
  // Un toque puede llegar por pointerup, touchend o click según el navegador:
  // lo que llegue primero actúa y los demás de ese mismo toque se ignoran.
  const dispara = (e) => {
    const t = performance.now();
    if(t - ultimo < 140) return;
    ultimo = t; accion(e);
  };
  el.addEventListener("pointerdown", (e) => { ix = e.clientX; iy = e.clientY; movio = false; }, {passive:true});
  el.addEventListener("pointerup", (e) => {
    if(Math.abs(e.clientX - ix) <= 12 && Math.abs(e.clientY - iy) <= 12) dispara(e);
  }, {passive:true});
  el.addEventListener("touchstart", (e) => {
    const t = e.changedTouches[0]; ix = t.clientX; iy = t.clientY; movio = false;
  }, {passive:true});
  el.addEventListener("touchmove", (e) => {
    const t = e.changedTouches[0];
    if(Math.abs(t.clientX - ix) > 12 || Math.abs(t.clientY - iy) > 12) movio = true;
  }, {passive:true});
  el.addEventListener("touchend", (e) => { if(!movio) dispara(e); }, {passive:true});
  // click "fantasma" tras un toque: se ignora; el de teclado o ratón sin pointer sí pasa
  el.addEventListener("click", (e) => {
    const t = performance.now();
    if(t - ultimo < 700) return;
    ultimo = t; accion(e);
  });
}

/* ═══════════════════════════════════════════════════════════
   CONTADOR DE AMOR
   ═══════════════════════════════════════════════════════════ */
function calcularTiempo(){
  const ahora = new Date();
  let años = ahora.getFullYear() - FECHA_NOVIOS.getFullYear();
  let meses = ahora.getMonth() - FECHA_NOVIOS.getMonth();
  let dias = ahora.getDate() - FECHA_NOVIOS.getDate();

  let h = ahora.getHours() - FECHA_NOVIOS.getHours();
  let m = ahora.getMinutes() - FECHA_NOVIOS.getMinutes();
  let s = ahora.getSeconds() - FECHA_NOVIOS.getSeconds();

  if(s < 0){ s += 60; m--; }
  if(m < 0){ m += 60; h--; }
  if(h < 0){ h += 24; dias--; }
  if(dias < 0){
    const finMesAnterior = new Date(ahora.getFullYear(), ahora.getMonth(), 0).getDate();
    dias += finMesAnterior; meses--;
  }
  if(meses < 0){ meses += 12; años--; }

  return {años, meses, dias, h, m, s};
}

const dosDig = (n) => String(n).padStart(2, "0");

function textoContador(){
  const t = calcularTiempo();
  if(t.años < 0) return "faltan poquito 🩷";
  const partes = [];
  if(t.años  > 0) partes.push(t.años + (t.años === 1 ? " año" : " años"));
  if(t.meses > 0) partes.push(t.meses + (t.meses === 1 ? " mes" : " meses"));
  partes.push(t.dias + (t.dias === 1 ? " día" : " días"));
  return "✿ " + partes.join(", ") + " · " + dosDig(t.h) + ":" + dosDig(t.m) + ":" + dosDig(t.s);
}

let noEscapado = false;      // ya salió de la fila
let moviendo   = false;
let relojMover;

/* El "No" sale de la tarjeta y se pega al <body>.
   Así su position:fixed se mide contra la pantalla de verdad
   y nunca más se pierde por el transform de la tarjeta.       */
function sacarNoDeLaFila(){
  if(noEscapado) return;
  noEscapado = true;

  const antes = btnSi.getBoundingClientRect();
  document.body.appendChild(btnNo);
  const despues = btnSi.getBoundingClientRect();

  // el "Sí" se desliza al centro sin brincos
  const dx = antes.left - despues.left;
  btnSi.style.transition = "none";
  btnSi.style.transform = "translateX(" + dx + "px)";
  requestAnimationFrame(() => {
    btnSi.style.transition = "transform .42s cubic-bezier(.22,1,.36,1)";
    btnSi.style.transform = "";
  });
}

function huirNo(){
  if(moviendo) return;
  moviendo = true;

  const caja = tarjeta.getBoundingClientRect();
  const bw = btnNo.offsetWidth || 90;
  const bh = btnNo.offsetHeight || 46;
  const margen = 10;
  const pegado = 16 + Math.random()*18;    // bien cerquita del cuadrado
  const lejosMax = 74;                     // y nunca más lejos que esto

  sacarNoDeLaFila();

  const lado = (Math.random()*4)|0;
  let x, y;
  if(lado === 0){                                   // arriba
    x = caja.left + Math.random()*(caja.width - bw);
    y = caja.top - bh - pegado;
  } else if(lado === 1){                            // derecha
    x = caja.right + pegado;
    y = caja.top + Math.random()*(caja.height - bh);
  } else if(lado === 2){                            // abajo
    x = caja.left + Math.random()*(caja.width - bw);
    y = caja.bottom + pegado;
  } else {                                          // izquierda
    x = caja.left - bw - pegado;
    y = caja.top + Math.random()*(caja.height - bh);
  }

  // 1) que nunca se despegue mucho del cuadrado
  x = Math.max(caja.left - lejosMax, Math.min(caja.right + lejosMax - bw, x));
  y = Math.max(caja.top  - lejosMax, Math.min(caja.bottom + lejosMax - bh, y));

  // 2) y que nunca se salga de lo que se ve en pantalla
  //    (visualViewport es lo correcto en Safari, innerWidth miente
  //     cuando la barra de direcciones aparece y desaparece)
  const vv = window.visualViewport;
  const aw = vv ? vv.width  : window.innerWidth;
  const ah = vv ? vv.height : window.innerHeight;
  x = Math.min(aw - bw - margen, Math.max(margen, x));
  y = Math.min(ah - bh - margen, Math.max(margen, y));

  btnNo.style.position = "fixed";
  btnNo.style.transition = "none";
  btnNo.style.left = x + "px";
  btnNo.style.top  = y + "px";

  clearTimeout(relojMover);
  relojMover = setTimeout(() => moviendo = false, 180);
}

function desarmarPregunta(){
  if(desarmado) return;
  desarmado = true;

  // un destello de chispas en el centro justo antes de que todo ceda
  const r = tarjeta.getBoundingClientRect();
  chispas(r.left + r.width/2, r.top + r.height/2, 18, null, 2.2);

  const cae = (p) => {
    p.style.setProperty("--dx", (Math.random()*90 - 45) + "px");
    p.style.setProperty("--r",  (Math.random()*44 - 22) + "deg");
    p.classList.add("cae");
  };

  piezas.forEach((p, i) => luego(() => cae(p), i*110));
  if(noEscapado) luego(() => cae(btnNo), 220);

  // el carrusel se abre mientras lo último todavía cae (se mezclan, sin pausa)
  luego(entrarCarrusel, 620);
  luego(() => {
    zonaPregunta.style.display = "none";
    if(noEscapado) btnNo.style.display = "none";

}

/* ═══════════════════════════════════════════════════════════
   PANTALLA 4 · CARRUSEL
   ═══════════════════════════════════════════════════════════ */
let indice = 0;
let relojFinal = null;
let carruselVivo = false;

function construirCarrusel(){
  pista.innerHTML = "";
  let numFoto = 0;
  LAMINAS.forEach(item => {
    const l = document.createElement("div");
    l.className = "lamina";
    if(item.frase){
      l.innerHTML = '<div class="lamina-frase"><p></p></div>';
      partirFrase(l.querySelector("p"), item.frase);
    } else {
      numFoto++;
      if(item.foto){
        const img = document.createElement("img");
        img.src = item.foto;
        img.alt = "";
        img.loading = "eager";
        img.decoding = "async";
        l.appendChild(img);
      } else {
        const hueco = document.createElement("div");
        hueco.className = "lamina-hueco";
        hueco.innerHTML = "<span>🩷</span>";
        const s = document.createElement("small");
        s.textContent = "Foto " + numFoto;
        hueco.appendChild(s);
        l.appendChild(hueco);
      }
    }
    pista.appendChild(l);
  });
}

let relojTiembla = null;
function temblar(){
  tarjeta.classList.remove("tiembla");
  void tarjeta.offsetWidth;                        // reinicia la animación
  tarjeta.classList.add("tiembla");
  clearTimeout(relojTiembla);
  relojTiembla = setTimeout(() => tarjeta.classList.remove("tiembla"), 480);
}

function ondear(flecha){
  flecha.classList.remove("ondea");
  void flecha.offsetWidth;
  flecha.classList.add("ondea");
  setTimeout(() => flecha.classList.remove("ondea"), 520);
}

function irA(n){
  const total = LAMINAS.length;

  // topes: en la primera no se puede ir atrás, en la última no se puede seguir.
  // Solo tiembla, sin ningún mensaje, y el reloj del final NO se cancela.
  if(n < 0 || n > total - 1){ temblar(); return; }

  indice = n;
  pista.style.transform = "translateX(-" + (indice*100) + "%)";
  marcarActiva();

  clearTimeout(relojFinal);
  if(indice === total - 1 && carruselVivo){
    // llegó a la última (la frase): 3 segundos y se cierra todo
    relojFinal = setTimeout(cerrarTodo, 3000);
  }
}

alTocar(flechaAtras,    () => { if(!carruselVivo) return; ondear(flechaAtras);    irA(indice - 1); });
alTocar(flechaAdelante, () => { if(!carruselVivo) return; ondear(flechaAdelante); irA(indice + 1); });

// deslizar con el dedo (la lámina sigue al dedo y se acomoda al soltar)
(() => {
  let x0 = null, y0 = null, dx = 0, arrastra = false, decidido = false;
  zonaCarrusel.addEventListener("touchstart", (e) => {
    const t = e.changedTouches[0]; x0 = t.clientX; y0 = t.clientY; dx = 0; arrastra = false; decidido = false;
  }, {passive:true});
  zonaCarrusel.addEventListener("touchmove", (e) => {
    if(x0 === null || !carruselVivo) return;
    const t = e.changedTouches[0]; dx = t.clientX - x0; const dy = t.clientY - y0;
    if(!decidido && (Math.abs(dx) > 8 || Math.abs(dy) > 8)){ decidido = true; arrastra = Math.abs(dx) > Math.abs(dy); }
    if(!arrastra) return;
    const tope = (indice === 0 && dx > 0) || (indice === LAMINAS.length - 1 && dx < 0);
    pista.style.transition = "none";
    pista.style.transform = "translate3d(calc(" + (-indice*100) + "% + " + (tope ? dx/3 : dx) + "px),0,0)";
  }, {passive:true});
  const fin = () => {
    if(x0 === null) return;
    const era = arrastra; x0 = null; arrastra = false;
    pista.style.transition = "";
    if(!carruselVivo) return;
    pista.style.transform = "translate3d(-" + (indice*100) + "%,0,0)";
    if(era && Math.abs(dx) > 45) irA(indice + (dx < 0 ? 1 : -1));
  };
  zonaCarrusel.addEventListener("touchend", fin, {passive:true});
  zonaCarrusel.addEventListener("touchcancel", fin, {passive:true});
})();

function entrarCarrusel(){
  construirCarrusel();
  indice = 0;
  pista.style.transition = "none";
  pista.style.transform = "translateX(0%)";
  requestAnimationFrame(() => pista.style.transition = "");
  marcarActiva(); luego(marcarActiva, 500);

  zonaCarrusel.classList.add("ver");
  escenario.classList.add("flota");
  carruselVivo = true;

  // el contador entra desde arriba y las flechas desde los lados, a la vez
  luego(() => {
    contador.className = "arriba";
    arrancarContador();
    escenario.classList.add("flechas");
  }, 260);
}

/* ═══════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════ */
function cerrarTodo(){
  if(!carruselVivo) return;
  carruselVivo = false;
  clearTimeout(relojFinal);

  luego(() => { enInicio = true; if(esDia17()) lanzarConfetiDia(); else lluviaBrillante(); }, 1400);

  luego(() => {

    contador.className = "centro";
  }, 380);

  luego(() => {
    escenario.classList.remove("ver");
    tarjeta.style.visibility = "hidden";
  }, 1100);

  luego(() => fraseGracias.classList.add("ver"), 2100);
  // y el botón sale detrás del contador hacia abajo
  luego(() => btnContinuar.classList.add("ver"), 3000);
}

/* ═══════════════════════════════════════════════════════════

function reiniciarTodo(){

const corazonSVG = () => '<svg viewBox="0 0 24 24"><use href="#' + ["fl0","fl0","fl1","fl1","fl2","fl3","fl4","rg0","rg1","rg2"][(Math.random()*10)|0] + '"/></svg>';

const FIG = [

];
function chispas(x, y, n, _f, alc){
  const box = $("chispas"); alc = alc || 1;
  if(box.childElementCount > 120) return;
  if(alc === 1){
    const o = document.createElement("i"); o.className = "onda"; o.style.left = x + "px"; o.style.top = y + "px";
    box.appendChild(o); setTimeout(() => o.remove(), 620);

  for(let i=0;i<n;i++){
    const e = document.createElement("i"), s = 13 + Math.random()*15;
    e.className = "chispa"; e.innerHTML = FIG[(Math.random()*3)|0]();
    e.style.cssText = "left:"+x+"px;top:"+y+"px;width:"+s+"px;height:"+s+"px";
    box.appendChild(e);
    const a = Math.random()*6.283, d = (36 + Math.random()*64)*alc, tx = Math.cos(a)*d, ty = Math.sin(a)*d - 24, r = Math.random()*120 - 60;
    const P = (k, sc, rt) => "translate(calc(-50% + "+(tx*k)+"px),calc(-50% + "+(ty*k + (k===1?30:0))+"px)) scale("+sc+") rotate("+rt+"deg)";
    e.animate([
      {transform:P(0,.3,0), opacity:1},
      {transform:P(.7,1.1,r/2), opacity:1, offset:.45},
      {transform:P(1,.5,r), opacity:0}
    ], {duration:650 + Math.random()*250, easing:"cubic-bezier(.2,.8,.3,1)", fill:"forwards"}).onfinish = () => e.remove();
  }
}

const azar = () => ABC[(Math.random()*ABC.length)|0];
function barajar(el, txt, dur, entra, fin){
  const D = Array.from(txt), n = D.length, t0 = performance.now();
  const id = setInterval(() => {
    const k = Math.min(1, (performance.now() - t0)/dur), r = (k*n)|0;
    el.textContent = D.map((ch, i) => (ch === " " || (entra ? i < r : i >= r)) ? ch : azar()).join("");
    if(k >= 1){
      clearInterval(id);
      el.textContent = entra ? txt : D.map(ch => ch === " " ? ch : azar()).join("");
      fin && fin();
    }
  }, 45);
}
/* El código (31 caracteres) SIEMPRE en una sola línea. Antes el tamaño se calculaba suponiendo 24
   caracteres, así que en el teléfono no cabía y saltaba de línea después de "[::-1]". Ahora se mide con
   la fuente monoespaciada real de cada teléfono (iPhone y Android la tienen distinta) y se reduce
   hasta que quepa en el recuadro. El letter-spacing va en em para que el ancho crezca en proporción exacta. */
function ajustarCodigo(el, anchoUtil){
  el.textContent = CODIGO;                                   // se mide el texto real; la baraja lo reemplaza enseguida
  el.style.fontSize = "20px";
  el.style.display = "inline-block"; el.style.maxWidth = "none";
  const a20 = el.offsetWidth || 1;                           // ancho del código a 20px
  el.style.display = ""; el.style.maxWidth = "";
  const tam = Math.max(8, Math.min(18, 20 * anchoUtil * .97 / a20));
  el.style.fontSize = tam.toFixed(2) + "px";
}
